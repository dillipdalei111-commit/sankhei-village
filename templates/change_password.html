{% extends 'base.html' %}
{% block title %}Change Password - Sankhei Portal{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    <h2 style="color: var(--primary); margin-bottom: 1.5rem; text-align: center;">Change Password</h2>
    <form method="POST" action="{{ url_for('change_password') }}">
        <div style="margin-bottom: 1rem;">
            <label for="current_password" style="display: block; margin-bottom: 0.5rem; color: var(--text-dark);">Current Password</label>
            <input type="password" id="current_password" name="current_password" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label for="new_password" style="display: block; margin-bottom: 0.5rem; color: var(--text-dark);">New Password</label>
            <input type="password" id="new_password" name="new_password" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
            <small style="color: var(--text-muted);">Minimum 6 characters.</small>
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="confirm_password" style="display: block; margin-bottom: 0.5rem; color: var(--text-dark);">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <button type="submit" class="cta-btn" style="width: 100%; border: none; cursor: pointer;">Update Password</button>
    </form>
</div>
{% endblock %}
