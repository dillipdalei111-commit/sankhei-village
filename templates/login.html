{% extends 'base.html' %}
{% block title %}Login - Sankhei Portal{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    <h2 style="color: var(--primary); margin-bottom: 1.5rem; text-align: center;">Admin Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div style="margin-bottom: 1rem;">
            <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text-dark);">Username</label>
            <input type="text" id="username" name="username" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-dark);">Password</label>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <button type="submit" class="cta-btn" style="width: 100%; border: none; cursor: pointer;">Login</button>
    </form>
</div>
{% endblock %}
